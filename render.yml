services:
  - type: web
    name: myapp
    runtime: docker
    plan: starter              # free = no disk, data resets
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true     # generated once, then persisted
      - key: DJANGO_DEBUG
        value: "False"
      - key: SQLITE_PATH
        value: /var/data/db.sqlite3
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
