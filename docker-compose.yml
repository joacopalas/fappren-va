services:
  web:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-prototype-insecure-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      PORT: ${PORT:-8000}
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - fappren_data:/app/data

volumes:
  fappren_data:
